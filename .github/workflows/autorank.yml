
name: Roblox Community Auto Rank

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: roblox-autorank
  cancel-in-progress: false

jobs:
  rank:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Run Auto Rank
        env:
          ROBLOX_API_KEY: ${{ secrets.ROBLOX_API_KEY }}
          DRY_RUN: "false"
        run: python -u ranker.py
