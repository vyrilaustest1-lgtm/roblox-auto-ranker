name: Auto Rank Community Members

on:
  schedule:
    - cron: '*/5 * * * *' # Runs every 5 minutes 24/7
  workflow_dispatch:       # Lets you click a button to run it manually anytime

jobs:
  run-ranker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - name: Run Auto-Ranker
        env:
          ROBLOX_API_KEY: ${{ secrets.ROBLOX_API_KEY }}
          GROUP_ID: ${{ secrets.GROUP_ID }}
        run: python ranker.py
